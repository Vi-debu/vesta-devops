spring:
  application:
    name: vesta-api
  datasource:
    url: ${DB_VESTA_URL}
    username: ${DB_VESTA_USER}
    password: ${DB_VESTA_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    ignore-migration-patterns: "*:missing,*:future"
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=300s
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  ai:
    azure:
      openai:
        api-key: ${AZURE_OPENAI_API_KEY}
        endpoint: ${AZURE_OPENAI_ENDPOINT}
        chat:
          options:
            deployment-name: ${AZURE_OPENAI_DEPLOYMENT}
            temperature: 0.3
            max-tokens: 1000

server:
  port: 8080

jwt:
  secret: ${Jwt__SecretKey}
  expiration-ms: 86400000

vesta:
  dotnet-service:
    url: ${DOTNET_URL}

logging:
  level:
    br.com.fiap.vesta: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info

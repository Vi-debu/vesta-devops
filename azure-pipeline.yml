trigger:
  branches:
    include:
      - master

pr:
  branches:
    include:
      - master

pool:
  vmImage: 'ubuntu-22.04'

variables:
  MAVEN_OPTS: '-Dmaven.repo.local=$(Pipeline.Workspace)/.m2/repository'

stages:
- stage: Build
  displayName: Build Java
  jobs:
  - job: BuildJava
    displayName: Build, Test and Publish
    steps:
    - task: Cache@2
      inputs:
        key: 'maven | "$(Agent.OS)" | vesta-api/pom.xml'
        restoreKeys: |
          maven | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/.m2/repository

    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - task: Maven@4
      displayName: Maven clean package
      inputs:
        mavenPomFile: 'vesta-api/pom.xml'
        goals: 'clean package'
        options: '$(MAVEN_OPTS)'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.17'
        mavenVersionOption: 'Default'

    - task: PublishTestResults@2
      displayName: Publish test results
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        failTaskOnFailedTests: true
      condition: succeededOrFailed()

    - task: CopyFiles@2
      displayName: Copy jar artifact
      inputs:
        SourceFolder: 'vesta-api/target'
        Contents: '*.jar'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: Publish artifact
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Deploy
  displayName: Deploy Azure Web App
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/master'))
  jobs:
  - deployment: DeployWebApp
    environment: production
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'azure-vesta-connection'
              appType: 'webAppLinux'
              appName: 'vestags'
              package: '$(Pipeline.Workspace)/drop/*.jar'
              runtimeStack: 'JAVA|21-java21'
              startUpCommand: 'java -jar /home/site/wwwroot/vesta-api-0.0.1-SNAPSHOT.jar'
